slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /scan

    resolution: 0.05
    publish_period_sec: 0.05
    transform_publish_period: 0.05

    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    # CRITICAL: Enable odometry/TF publishing
    publish_tf: true
