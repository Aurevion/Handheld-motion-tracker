ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    base_link_frame: base_link
    odom_frame: odom
    world_frame: odom

    # Odometry input (from SLAM/encoders)
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 2
    odom0_nodelay: false
    odom0_differential: false

    # IMU input (rotation + angular velocity)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_queue_size: 2
    imu0_nodelay: false
    imu0_differential: true
    imu0_remove_gravitational_acceleration: true
